# iw.hub 기종 프로파일 → VDA 5050 factsheet (MQTT_CONTRACT §4.2). 원천은 2_Simulation/sil_isaac/robot/profile.py 의
# RobotProfile(IWHUB) 실측값 — 두 곳의 숫자가 다르면 profile.py 가 맞고 이 파일을 고친다.
model: iw.hub
manufacturer: idealworks          # VDA manufacturer = 기종별 (계약 §1 결정 5)
kinematic: DIFF                   # agvKinematic: DIFF | OMNI | THREEWHEEL
agv_class: CARRIER                # FORKLIFT | CONVEYOR | TUGGER | CARRIER
max_load_kg: 1000                 # 카탈로그 (iw.hub 적재 1,000 kg)
# 속도·가감속 — 에이전트 클램프와 같은 출처 (profile.py max_lin 1.2, config/agent.yaml a_max 1.0, v_min 0.05)
v_min: 0.05
v_max: 1.2
a_max: 1.0
# 치수 [m] — turn_probe 실측: 축 기준 앞 0.40 · 뒤 1.03, 폭 0.66, 높이 0.41
length: 1.43
width: 0.66
height: 0.41
front_overhang: 0.40
rear_overhang: 1.03
swing_radius: 1.09
# 바퀴 — 실측 반경 0.08, 트랙 0.58 (y ±0.29). 차량 좌표계: x 앞, y 왼쪽, 원점 = 구동축 중심 = 회전 중심
wheels:
  - { type: DRIVE, is_active_driven: true, is_active_steered: false, position: { x: 0.0, y: 0.29 }, diameter: 0.16, width: 0.05 }
  - { type: DRIVE, is_active_driven: true, is_active_steered: false, position: { x: 0.0, y: -0.29 }, diameter: 0.16, width: 0.05 }
  - { type: CASTER, is_active_driven: false, is_active_steered: false, position: { x: -0.677, y: 0.093 }, diameter: 0.11, width: 0.04 }
  - { type: CASTER, is_active_driven: false, is_active_steered: false, position: { x: -0.677, y: -0.093 }, diameter: 0.11, width: 0.04 }
# 타이밍 [s] — executor state_rate_hz 2.0 (sim time)
state_interval: 0.5
order_interval: 0.5
