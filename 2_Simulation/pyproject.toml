# pytest 대상은 t3_amr/edge/tests 뿐이다(-215 엣지). t3_amr/path/test_lifelong_battery.py 는 main() 으로 도는 실측 스크립트라 뺀다.
[tool.pytest.ini_options]
testpaths = ["t3_amr/edge/tests"]
pythonpath = ["t3_amr"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["**/out", "**/sparkplug_b_pb2.py"]   # 생성 코드(protoc)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402"]  # Isaac 스크립트는 SimulationApp 뒤에 import 해야 함
