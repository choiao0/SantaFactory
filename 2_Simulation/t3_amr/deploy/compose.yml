# 로컬(GPU 박스) 검증용 — k3s 전 단계. docker compose -f 2_Simulation/t3_amr/deploy/compose.yml up
# 필요: docker 그룹 권한 + nvidia-container-toolkit + buildx·compose 플러그인 (deploy/README.md §0)
services:
  t3amr-runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      additional_contexts:
        sim_engine: ../../../3_FMS/sim_engine     # 계획기 원본 — Dockerfile 의 COPY --from=sim_engine (compose ≥ 2.17)
    image: t3amr-runner:dev
    container_name: t3amr-runner
    command: ["edge"]                 # 한 번 녹화만 보려면: ["record", "3"]
    env_file:
      - ../../../3_FMS/infra/emqx/.env      # MQTT_HOST · MQTT_PORT · MQTT_PW_SIM_RUNNER (gitignored)
      - .env                                # MINIO_ACCESS_KEY · MINIO_SECRET_KEY = EC2 ~/minio-keys/sim-runner.env (쓰기 전용 계정, gitignored, -233)
    environment:
      NODE_ID: sim-runner-gpu01       # host-orch --node 와 같아야 한다
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-100.100.149.68:9002}     # tailnet 직결(http). 업로드만 하므로 공개 주소가 필요 없다
      MINIO_BUCKET: ${MINIO_BUCKET:-verify-videos}
    volumes:
      - ov-cache:/cache/ov            # Kit 셰이더 캐시 — 첫 기동 수 분, 이후 재사용
      - ./data:/data                  # out(mp4·프레임) · state(bdSeq · 런 로그)
    # WebRTC 관전 포트는 기본으로 열지 않는다(녹화에 불필요, 캠퍼스망 UDP 차단). 필요하면 ports: ["49100:49100/tcp", "47998:47998/udp"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              # ★ ngx 가 있어야 NGX(DLSS 디노이저) 라이브러리가 들어온다(-237). 이 목록이 마운트 범위를 정하므로 이미지의
              #   NVIDIA_DRIVER_CAPABILITIES=all 은 여기서 무시된다. 없으면 Kit 이 "Failed to create NGX context" 로
              #   디노이저 없이 렌더해 프레임이 온통 노이즈가 되고 mp4 가 100 Mbps(30 s 에 366 MB)로 커진다 — 2026-09-16 verify_4.
              #   단독 `docker run --gpus all` 은 all 이라 괜찮았다. k8s 는 env all 그대로.
              capabilities: [gpu, graphics, utility, compute, video, ngx]
    restart: unless-stopped
volumes:
  ov-cache:
    name: t3amr-ov-cache            # 고정 이름 — compose 프로젝트명(폴더명)에 안 묶여 단독 docker run(deploy/README §1)과 셰이더 캐시를 공유한다
