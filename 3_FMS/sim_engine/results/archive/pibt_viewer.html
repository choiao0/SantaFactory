<title>PIBT 궤적 플레이어</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #10151c;
    --panel: #1a212b;
    --panel-edge: #242e3b;
    --wall: #2b3442;
    --aisle-block: #1f2732;
    --text: #dce4ee;
    --muted: #8494a8;
    --accent: #4da3ff;
    --accent-dim: #2c5f96;
    --station: #35c98e;
    --sans: "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
    --mono: "IBM Plex Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 14px 22px 12px;
    border-bottom: 1px solid var(--panel-edge);
    flex-wrap: wrap;
  }
  h1 {
    font-size: 17px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  h1 small {
    color: var(--muted);
    font-weight: 400;
    font-size: 12px;
    margin-left: 10px;
  }
  .tabs { display: flex; gap: 6px; }
  .tabs button {
    font: 500 13px var(--sans);
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .tabs button.on {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
  }
  .tabs button:focus-visible,
  .dock button:focus-visible,
  input:focus-visible, select:focus-visible, label:focus-within {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .stat {
    margin-left: auto;
    font: 500 13px var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .stat b { color: var(--station); font-weight: 500; }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    min-height: 0;
  }
  canvas { max-width: 100%; height: auto; display: block; border-radius: 8px; }
  .dock {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 22px 16px;
    border-top: 1px solid var(--panel-edge);
    background: var(--panel);
    flex-wrap: wrap;
  }
  .dock button#play {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--bg);
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #slider { flex: 1; min-width: 160px; accent-color: var(--accent); }
  .tick {
    font: 500 13px var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--text);
    min-width: 96px;
    text-align: right;
  }
  .dock select {
    font: 500 13px var(--mono);
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 6px 8px;
  }
  .dock label {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .dock input[type=checkbox] { accent-color: var(--accent); }
  .legend {
    padding: 8px 22px 14px;
    background: var(--panel);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }
  .key { display: flex; align-items: center; gap: 6px; }
  .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
</style>

<script>
const DATA = JSON.parse(document.getElementById("viz-data").textContent);
const { H, W, free_rows, stations, scenarios } = DATA;

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const CELL = 7;                      // 논리 px/칸
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * CELL * dpr;
cv.height = H * CELL * dpr;
cv.style.width = W * CELL + "px";
ctx.scale(dpr, dpr);

// origin="lower": 배열 0행이 남쪽(아래). 그릴 때만 위아래 반전.
const px = c => c * CELL;
const py = r => (H - 1 - r) * CELL;

// 정적 레이어(벽/스테이션)는 오프스크린에 한 번만 그림
const staticLayer = document.createElement("canvas");
staticLayer.width = cv.width; staticLayer.height = cv.height;
{
  const s = staticLayer.getContext("2d");
  s.scale(dpr, dpr);
  s.fillStyle = css("--bg");
  s.fillRect(0, 0, W * CELL, H * CELL);
  s.fillStyle = css("--wall");
  for (let r = 0; r < H; r++)
    for (let c = 0; c < W; c++)
      if (free_rows[r][c] === "0") s.fillRect(px(c), py(r), CELL, CELL);
  s.fillStyle = css("--station");
  for (const [r, c] of Object.values(stations))
    s.fillRect(px(c) + 1, py(r) + 1, CELL - 2, CELL - 2);
}

const agentColor = (i, n) => `hsl(${Math.round(360 * i / n)} 70% 62%)`;

let scen, frames, goals, N, T;
let t = 0;                 // 현재 틱 (실수 — 틱 사이 보간)
let playing = false;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const slider = document.getElementById("slider");
const tickEl = document.getElementById("tick");
const statEl = document.getElementById("stat");
const playBtn = document.getElementById("play");
const speedEl = document.getElementById("speed");
const trailsEl = document.getElementById("trails");

function setScenario(key) {
  scen = scenarios[key];
  frames = scen.frames; goals = scen.goals;
  N = goals.length; T = frames.length - 1;
  t = 0; playing = false; playBtn.textContent = "▶";
  slider.max = T;
  for (const b of document.querySelectorAll(".tabs button"))
    b.classList.toggle("on", b.dataset.k === key);
  draw();
}

const tabsEl = document.getElementById("tabs");
for (const [k, sc] of Object.entries(scenarios)) {
  const b = document.createElement("button");
  b.textContent = sc.label; b.dataset.k = k;
  b.onclick = () => setScenario(k);
  tabsEl.appendChild(b);
}

function lerpPos(a, tt) {
  const i = Math.min(Math.floor(tt), T - 1 < 0 ? 0 : T - 1);
  const f = Math.min(tt, T) - i;
  const [r0, c0] = frames[i][a];
  const [r1, c1] = frames[Math.min(i + 1, T)][a];
  return [r0 + (r1 - r0) * f, c0 + (c1 - c0) * f];
}

function draw() {
  ctx.drawImage(staticLayer, 0, 0, W * CELL, H * CELL);
  const ti = Math.min(Math.round(t), T);

  if (trailsEl.checked) {
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.35;
    for (let a = 0; a < N; a++) {
      ctx.strokeStyle = agentColor(a, N);
      ctx.beginPath();
      const back = Math.max(0, ti - 40);
      for (let k = back; k <= ti; k++) {
        const [r, c] = frames[k][a];
        const x = px(c) + CELL / 2, y = py(r) + CELL / 2;
        k === back ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  for (let a = 0; a < N; a++) {               // 목표: 링
    const [r, c] = goals[a];
    ctx.strokeStyle = agentColor(a, N);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(px(c) + CELL / 2, py(r) + CELL / 2, CELL / 2 + 1, 0, 7);
    ctx.stroke();
  }

  let arrived = 0;
  for (let a = 0; a < N; a++) {               // 로봇: 원
    const [r, c] = lerpPos(a, t);
    if (frames[ti][a][0] === goals[a][0] && frames[ti][a][1] === goals[a][1]) arrived++;
    ctx.fillStyle = agentColor(a, N);
    ctx.beginPath();
    ctx.arc(px(c) + CELL / 2, py(r) + CELL / 2, CELL / 2 - 0.5, 0, 7);
    ctx.fill();
  }

  slider.value = ti;
  tickEl.textContent = `t ${String(ti).padStart(3)} / ${T}`;
  statEl.innerHTML = `도달 <b>${arrived}</b>/${N}`;
}

let last = null;
function loop(now) {
  if (playing) {
    if (last !== null) {
      const tps = +speedEl.value;
      t += (reduceMotion ? 0 : (now - last) / 1000 * tps);
      if (reduceMotion) t = Math.min(T, Math.round(t) + 1);  // 보간 없이 틱 단위
      if (t >= T) { t = T; playing = false; playBtn.textContent = "▶"; }
    }
    draw();
  }
  last = now;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function togglePlay() {
  if (!playing && t >= T) t = 0;
  playing = !playing;
  playBtn.textContent = playing ? "❚❚" : "▶";
}
playBtn.onclick = togglePlay;
slider.oninput = () => { t = +slider.value; playing = false; playBtn.textContent = "▶"; draw(); };
trailsEl.onchange = draw;
document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  if (e.key === "ArrowRight") { t = Math.min(T, Math.round(t) + 1); playing = false; draw(); }
  if (e.key === "ArrowLeft") { t = Math.max(0, Math.round(t) - 1); playing = false; draw(); }
});

setScenario("A");
</script>
