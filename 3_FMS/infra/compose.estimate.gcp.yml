# GCP 워커 — infra/compose.estimate.yml 의 GCP 판 (S15P21A106-246, 2026-09-18). EC2 판과 다른 점 셋:
#   · santafactory_default(external) 네트워크가 없다 — 브로커는 EC2 공인 주소의 AMQPS 5671(nginx stream TLS 종단, infra/nginx/) 로 붙는다
#   · 계정은 원격 워커 전용 sim-worker (sim.request 소비 · sim.result 발행만) — EC2 ~/rabbitmq-keys/sim-worker.env
#   · replicas 기본 4 = SMT 끈 물리 코어 수 (c4-highcpu-8, 코어당 vCPU 1) · 메모리 3G (n=12·13 이 2G 한도에 닿았다 — gcp/README.md)
# 기동:  cd ~/fms/3_FMS/infra && docker compose -f compose.estimate.gcp.yml --env-file .env.estimate up -d --build
#        .env.estimate = RABBITMQ_USER / RABBITMQ_PASSWORD (EC2 브로커와 같은 계정, 레포엔 없음)
name: fms-estimate
services:
  estimate-worker:
    build:
      context: ..
      dockerfile: infra/estimate.Dockerfile
    image: fms-estimate-worker:latest
    environment:
      RABBITMQ_URL: amqps://${RABBITMQ_USER:?.env.estimate 에 RABBITMQ_USER}:${RABBITMQ_PASSWORD:?.env.estimate 에 RABBITMQ_PASSWORD}@${RABBITMQ_HOST:-j15a106.p.ssafy.io}:${RABBITMQ_PORT:-5671}/
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-4}
      resources:
        limits:
          cpus: "1.0"
          memory: 3G
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
