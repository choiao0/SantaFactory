# 워커가 브로커에 붙는 주소. 실제 값은 저장소에 두지 않고 EC2 에서 한 번 만든다 (README).
# 계정 sim-worker 는 EC2 ~/rabbitmq-keys/sim-worker.env — GCP compose 워커와 같은 5671(TLS) 경로·계정을 그대로 쓴다.
apiVersion: v1
kind: Secret
metadata:
  name: sim-worker-broker
  namespace: fms
type: Opaque
stringData:
  RABBITMQ_URL: amqps://sim-worker:<비밀번호>@j15a106.p.ssafy.io:5671/
