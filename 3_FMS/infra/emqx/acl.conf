%% 3_FMS/infra/emqx/acl.conf — MQTT 백본 ACL (MQTT_CONTRACT.md §3 의 원본). 위에서 아래로 첫 일치, 마지막은 전부 거부.
%% 사용자명 = VDA serialNumber(amr01…) 또는 Sparkplug edge_node_id / host_id. ${username} 으로 자기 이름 아래만 연다.
%% retained 는 connection·factsheet·STATE 에만. 나머지 발행 규칙은 {publish, [{retain, false}]} 라 retained 발행은
%% 어느 규칙에도 안 걸려 마지막 {deny, all} 로 떨어진다 (EMQX 6.3.0 실행 검증 2026-09-08).
%% 문법: {perm, who, action | {action, [{qos, 0..2}, {retain, true|false|all}]}, [topic | {eq, topic}]}.

%% 에이전트: 자기 시리얼 아래만
{allow, {username, {re, "^amr[0-9]+$"}}, {publish, [{retain, all}]},
  ["uagv/v2/+/${username}/connection", "uagv/v2/+/${username}/factsheet"]}.
{allow, {username, {re, "^amr[0-9]+$"}}, {publish, [{retain, false}]},
  ["uagv/v2/+/${username}/state", "uagv/v2/+/${username}/visualization"]}.
{allow, {username, {re, "^amr[0-9]+$"}}, subscribe,
  ["uagv/v2/+/${username}/order", "uagv/v2/+/${username}/instantActions"]}.

%% FMS 코어: VDA 마스터 + Sparkplug Edge(fms-core) + biz 이벤트. 전부 비-retained
{allow, {username, "fms-core"}, {publish, [{retain, false}]},
  ["uagv/v2/+/+/order", "uagv/v2/+/+/instantActions", "biz/v1/event",
   "spBv1.0/santa/NBIRTH/fms-core", "spBv1.0/santa/NDEATH/fms-core", "spBv1.0/santa/NDATA/fms-core"]}.
{allow, {username, "fms-core"}, subscribe,
  ["uagv/v2/+/+/state", "uagv/v2/+/+/connection", "uagv/v2/+/+/factsheet",
   "spBv1.0/STATE/+", "spBv1.0/santa/NCMD/fms-core", "biz/v1/order"]}.

%% sim-runner: Sparkplug Edge + VDA state 거울 구독. 전부 비-retained.
%% GPU 1대에서 컨테이너 여러 개(sim-runner-gpu01..0N, spec244 §E) — amr 규칙과 같은 정규식 + ${username}
%% 토픽 스코핑으로 일반화한다(-244). 노드마다 별도 비밀번호를 줄 이유가 없어 bootstrap_users.sh 처럼
%% 계정군 전체가 같은 비밀번호를 쓴다 — 대신 ${username} 이 자기 edge_node_id 아래만 열어 서로의
%% NBIRTH/NCMD 를 건드리지 못한다(다른 노드 이름을 쓰면 이 규칙 어디에도 안 걸려 마지막 deny 로 떨어진다).
{allow, {username, {re, "^sim-runner-gpu\\d+$"}}, {publish, [{retain, false}]},
  ["spBv1.0/santa/NBIRTH/${username}", "spBv1.0/santa/NDEATH/${username}",
   "spBv1.0/santa/NDATA/${username}",  "spBv1.0/santa/DBIRTH/${username}/+",
   "spBv1.0/santa/DDEATH/${username}/+", "spBv1.0/santa/DDATA/${username}/+"]}.
{allow, {username, {re, "^sim-runner-gpu\\d+$"}}, subscribe,
  ["spBv1.0/santa/NCMD/${username}", "spBv1.0/santa/DCMD/${username}/+",
   "spBv1.0/STATE/+", "uagv/v2/+/+/state", "uagv/v2/+/+/connection"]}.

%% Primary Host: STATE 만 retained, NCMD/DCMD 는 비-retained. 세 레인 전부 읽는다 (관측 창 · 런 KPI)
{allow, {username, "host-orch"}, {publish, [{retain, all}]},   ["spBv1.0/STATE/host-orch"]}.
{allow, {username, "host-orch"}, {publish, [{retain, false}]}, ["spBv1.0/santa/NCMD/+", "spBv1.0/santa/DCMD/+/+"]}.
{allow, {username, "host-orch"}, subscribe, ["spBv1.0/#", "biz/v1/#", "uagv/v2/+/+/#"]}.

%% 시뮬 WMS: biz 레인만. Sparkplug·VDA 토픽은 어느 쪽도 허용하지 않는다
{allow, {username, "sim-wms"}, {publish, [{retain, false}]}, ["biz/v1/order"]}.
{allow, {username, "sim-wms"}, subscribe, ["biz/v1/event"]}.

{deny, all}.
