# 3_FMS/infra/emqx/emqx.conf — MQTT 백본 브로커 설정 (HOCON). 로컬 compose 와 EC2 k3s(4_Web/k8s/emqx/) 가 같은 파일을 쓴다.
# 계약: 3_FMS/contracts/MQTT_CONTRACT.md. 키 이름은 EMQX 6.3 문서(docs.emqx.com/en/emqx/latest) 로 대조, 6.3.0 실행 검증 2026-09-08.
# 비밀은 여기 두지 않는다 — node.cookie 와 dashboard.default_password 는 환경변수 EMQX_NODE__COOKIE · EMQX_DASHBOARD__DEFAULT_PASSWORD 로 넣는다.

node {
  name = "emqx@127.0.0.1"
  data_dir = "data"                     # 6.3 부터 필수. 컨테이너에서는 /opt/emqx/data (compose 의 emqx-data 볼륨)
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"                 # MQTT 3.1.1 / TCP. EC2 에서는 tailnet·클러스터 내부만 (보안 그룹 443 외 차단)
  max_connections = 1024
}
listeners.ssl.default.enable = false     # TLS 없음 — tailscale 이 전송 보호 (계약 §0)
listeners.ws.default.enable = false
listeners.wss.default.enable = false

dashboard {
  listeners.http.bind = 18083            # 로컬 전용 (compose 는 127.0.0.1 에만 노출, k3s 는 port-forward)
}

# 계정: 내장 DB, 사용자명 = 시리얼 또는 edge_node_id (계약 §3). 최초 기동 때 etc/users.csv 를 한 번 읽어 채운다
# (bootstrap_users.sh 가 .env 에서 생성). 그 뒤 변경은 대시보드/REST — CSV 는 다시 읽지 않는다.
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    bootstrap_file = "etc/users.csv"
    bootstrap_type = plain
  }
]

# 인가: etc/acl.conf 가 원본. 규칙에 없으면 거부, 위반 시 연결 끊음 (테스트 test_acl_matrix.py 가 이 동작을 고정한다).
authorization {
  no_match = deny
  deny_action = disconnect
  cache { enable = true }
  sources = [
    { type = file, enable = true, path = "etc/acl.conf" }
  ]
}

mqtt {
  max_packet_size = "1MB"
  max_qos_allowed = 1                    # 계약 §1: QoS 상한 1
  retain_available = true                # retained 는 acl.conf 로 connection·factsheet·STATE 에만 허용
  idle_timeout = "15s"
}

retainer {
  enable = true
}
