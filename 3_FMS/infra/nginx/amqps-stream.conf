# AMQPS 종단 (S15P21A106-246, 2026-09-18): GCP DES 워커 → 5671(TLS) → RabbitMQ 127.0.0.1:5672 (루프백 평문)
# 설치 위치 EC2 /etc/nginx/stream.d/amqps.conf. 출발지 제한은 ufw (5671/tcp from GCP NAT 고정 IP, infra/firewall/README.md).
# 인증서는 certbot 것 그대로 — 갱신 시 nginx reload 로 반영된다.
server {
    listen 5671 ssl;
    ssl_certificate     /etc/letsencrypt/live/j15a106.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15a106.p.ssafy.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    proxy_pass          127.0.0.1:5672;
    proxy_connect_timeout 5s;
    proxy_timeout       1h;    # AMQP 장수 연결 — 하트비트 60 s 가 있어 유휴로 끊길 일은 없지만 넉넉히
}
