# 사설 레지스트리 공인 경로 (S15P21A106-249, 2026-09-18): k3s 노드(GCP) → https://j15a106.p.ssafy.io/v2/… → registry 127.0.0.1:5000
# 설치 위치 EC2 /etc/nginx/snippets/registry-v2.conf — j15a106.p.ssafy.io 의 443 server 블록 안에 `include snippets/registry-v2.conf;`
# push 는 Jenkins 가 루프백 5000 으로 직접 하므로 여기로 오지 않는다. 이 경로는 노드의 pull 전용 — 출발지 Cloud NAT IP, GET/HEAD 만.
location /v2/ {
    allow 34.47.111.62;                 # GCP Cloud NAT 고정 IP (infra/gcp/README.md). 5671 브로커와 같은 원칙
    deny  all;
    limit_except GET HEAD { deny all; } # pull 만. push(POST/PUT/PATCH/DELETE)는 루프백 경로로만
    client_max_body_size 0;
    chunked_transfer_encoding on;
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host              $http_host;    # registry 가 Location 헤더를 공인 이름으로 만들도록
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900;
}
