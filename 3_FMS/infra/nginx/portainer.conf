# Portainer 를 443 의 /portainer/ 경로 뒤에 (S15P21A106-262, 2026-09-21). Portainer 공식 "nginx 뒤에서 하위 경로" 예제 그대로.
# 설치 위치 EC2 /etc/nginx/snippets/portainer.conf — j15a106.p.ssafy.io 의 443 server 블록 안에 `include snippets/portainer.conf;`
# 뒤의 슬래시가 핵심이다: /portainer/ → 컨테이너의 / . 로그·콘솔 스트림은 웹소켓이라 두 번째 location 이 따로 필요하다.
# 접근 제한은 Portainer 자체 로그인(관리자 계정)으로 한다 — 출발지 IP 제한을 두지 않는 이유는 담당자 PC 주소가 고정이 아니어서다.
location /portainer/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:9100/;   # 호스트 9000 은 SonarQube — compose 가 9100 으로 매핑
}
location /portainer/api/websocket/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $http_host;
    proxy_read_timeout 3600;
    proxy_pass http://127.0.0.1:9100/api/websocket/;
}
