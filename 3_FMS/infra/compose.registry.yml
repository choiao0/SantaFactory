# 사설 이미지 레지스트리 (S15P21A106-248). Jenkins 가 EC2 에서 구운 워커 이미지를 올려 두고 k3s 노드(GCP)가 받아 간다.
# SSAFY GitLab 은 컨테이너 레지스트리가 꺼져 있어 EC2 에 직접 둔다.
#   · 127.0.0.1:5000     — EC2 자신이 push 할 때. 도커는 루프백 평문 레지스트리를 기본 허용해 daemon.json 을 안 건드린다
#   · 100.100.149.68:5000 — tailnet. 노드가 pull 할 때. 각 노드의 /etc/rancher/k3s/registries.yaml 이 이 주소를 평문으로 받게 한다
# 공인 NIC 에는 열지 않는다. 오래된 태그는 k8s/registry-prune.sh 가 지운다(DELETE 허용이 그래서 켜져 있다).
# 2026-09-18 EC2 에는 같은 내용을 docker run 으로 먼저 올렸다(컨테이너 a106-registry, 볼륨 registry-data). compose 로 바꾸려면
#   docker rm -f a106-registry && docker compose -f compose.registry.yml up -d
name: a106-registry
services:
  registry:
    image: registry:2
    container_name: a106-registry
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "127.0.0.1:5000:5000"
      - "100.100.149.68:5000:5000"
    volumes:
      - registry-data:/var/lib/registry
volumes:
  registry-data:
    external: true
