# 프런트 (정적 파일 nginx) — 4_Web/docker-compose.yml 의 frontend 서비스를 k3s 로 (S15P21A106-258).
# SPA 는 같은 도메인의 /api 를 부르고 host nginx 가 백엔드로 넘기므로 이 컨테이너는 백엔드를 모른다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: web
  labels:
    app: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: ip-172-26-3-57
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: frontend
          image: j15a106.p.ssafy.io/santafactory-fe:latest
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: web
spec:
  type: ClusterIP
  clusterIP: 10.43.0.30
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
