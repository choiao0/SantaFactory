server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 백엔드. compose 네트워크 안의 서비스 이름으로 붙는다.
    #
    # 견적 진행(GET /api/estimates/{id}, Accept: text/event-stream)이 SSE 라서
    # 버퍼링을 끄고 타임아웃을 길게 잡는다. 견적 1건이 대수 20 × 시뮬 34s ≈ 13분까지
    # 걸리므로 기본 60s 로는 스트림이 끊긴다. 백엔드도 이 응답에 X-Accel-Buffering: no
    # 를 붙이지만, 여기서 한 번 더 못 박아 둔다.
    location /api/ {
        # 업스트림을 변수로 넘긴다 — 리터럴로 쓰면 nginx 가 기동 시점에 DNS 를 풀고,
        # backend 가 아직 없으면 "host not found in upstream" 으로 이 컨테이너가 못 뜬다.
        # (Jenkins 는 frontend 를 따로 up 한다.) 127.0.0.11 은 도커 내장 DNS.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream "backend:8080";
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
