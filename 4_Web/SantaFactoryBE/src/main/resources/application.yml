spring:
  application:
    name: santafactory-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/santafactory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

sim:
  base-url: ${SIM_BASE_URL:http://localhost:8000}
  connect-timeout: 3s
  read-timeout: 10s
  callback-token: ${SIM_CALLBACK_TOKEN:change-me}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
