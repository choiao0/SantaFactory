spring:
  application:
    name: santafactory-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/santafactory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8080

sim:
  request-queue: sim.request
  result-queue: sim.result

estimate:
  # amr-price / install-per-unit 은 robots 시드의 price(단가) / cost(구축·설치비)와 같은 값 — 둘 다 대당
  amr-price: 15000000
  install-per-unit: 500000
  # 충전기 단가는 DB·ERD 어디에도 없어 팀 미정 (0이면 비용에 미반영)
  charger-price: 0
  max-amr-count: 8
  max-chargers: 6
  amr-per-charger: 4
  amr-count-margin: 1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
