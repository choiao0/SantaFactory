spring:
  application:
    name: santafactory-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/santafactory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8080

sim:
  request-queue: sim.request
  result-queue: sim.result

estimate:
  # 단가 3개는 팀 미정 — 확정되면 이 값만 고친다 (0이면 예산 기반 대수 산정을 건너뛰고 상한까지 시도)
  amr-price: 0
  charger-price: 0
  install-fixed: 0
  max-fleet: 8
  max-chargers: 6
  amr-per-charger: 4
  fleet-margin: 1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
